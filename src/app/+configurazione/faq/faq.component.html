<app-layout-title [title]="'faq.title'" [subTitle]="'faq.subtitle'"></app-layout-title>

<app-layout-wait [loaded]="faqs"></app-layout-wait>

<section *ngFor="let faqType of faqs | keyvalue" class="mt-4 mb-5">
  <h2 class="h4 text-primary mb-3">{{ faqType.key | translate }}</h2>
  <app-accordion [closeOthers]="true" class="d-block shadow-sm rounded">
    <app-accordion-group *ngFor="let faq of faqType.value">
      <span accordion-heading class="fw-semibold">{{ faq.question }}</span>
      <div [innerHtml]="faq.answer"></div>
    </app-accordion-group>
  </app-accordion>
</section>

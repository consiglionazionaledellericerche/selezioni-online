<div class="row row-title pt-4 pb-2">
  <div class="d-xl-flex align-items-end border-bottom border-primary pb-3">
    <div>
      <h1 class="h2 text-primary mb-1">{{ 'layout.calls' | translate }}</h1>
      <p class="mb-0 text-secondary">{{ 'layout.calls_subtitle' | translate }}</p>
    </div>
  </div>
</div>

<div class="row mt-4" *ngIf="filterFormHome">
  <!-- Filtri -->
  <aside class="col-lg-3 mb-4">
   <div class="filters-sticky">
    <form [formGroup]="filterFormHome" class="filters card shadow-sm rounded p-3" role="search">
      <div class="form-group mb-4">
        <label for="home_code" class="active">{{ 'call.codice' | translate }}</label>
        <div class="input-group">
          <input id="home_code" type="search" class="form-control" formControlName="callCode"
                 [placeholder]="'layout.search_placeholder' | translate">
          <span class="input-group-text">
            <svg class="icon icon-sm icon-primary"><use href="/bootstrap-italia/dist/svg/sprites.svg#it-search"></use></svg>
          </span>
        </div>
      </div>

      <app-sort-control class="d-block mt-4 mb-4" [form]="filterFormHome" [options]="sortOptions"></app-sort-control>

      <h2 class="filters-title">{{ 'layout.call_state' | translate }}</h2>
      <div class="btn-group w-100 mb-4" role="group" [attr.aria-label]="'layout.call_state' | translate">
        <button *ngFor="let state of states" type="button" class="btn btn-sm flex-fill px-1"
                [ngClass]="filterFormHome.value.filterType === state.value ? 'btn-primary' : 'btn-outline-primary'"
                [attr.aria-pressed]="filterFormHome.value.filterType === state.value"
                (click)="setState(state.value)">{{ state.label | translate }}</button>
      </div>

      <h2 class="filters-title">{{ 'layout.call_type' | translate }}</h2>
      <ul class="type-list list-unstyled mb-0">
        <li>
          <a href="javascript:void(0)" [class.active]="filterFormHome.value.type === 'jconon_call:folder'"
             (click)="setType('jconon_call:folder')">{{ 'F:jconon_call:folder' | translate }}</a>
        </li>
        <ng-container *ngFor="let item of cache?.jsonlistCallType">
          <li *ngIf="item.display">
            <a *ngIf="!item.childs" href="javascript:void(0)" [class.active]="filterFormHome.value.type === item.queryName"
               (click)="setType(item.queryName)">{{ typeLabel(item) }}</a>
            <ng-container *ngIf="item.childs">
              <span class="type-group">{{ typeLabel(item) }}</span>
              <ul class="list-unstyled">
                <li *ngFor="let child of item.childs">
                  <a href="javascript:void(0)" class="ps-3" [class.active]="filterFormHome.value.type === child.queryName"
                     (click)="setType(child.queryName)">{{ typeLabel(child) }}</a>
                </li>
              </ul>
            </ng-container>
          </li>
        </ng-container>
      </ul>
    </form>
   </div>
  </aside>

  <!-- Risultati -->
  <section class="col-lg-9" [attr.aria-label]="'layout.calls' | translate">
    <call-list [filterForm]="filterFormHome" [showTotalOnTop]="true"></call-list>
  </section>
</div>

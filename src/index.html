<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Load environment variables -->
  <script src="assets/env.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0066cc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Selezioni CNR">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // il pulsante "Installa l'app" della pagina Notifiche usa l'evento del browser, che arriva presto
    window.addEventListener('beforeinstallprompt', function (event) { event.preventDefault(); window.__installPrompt = event; });
  </script>
</head>
<body>
<app-root>
  <div class="loader"></div>
</app-root>
  <noscript>Per usare Selezioni online CNR è necessario abilitare JavaScript.</noscript>
</body>
</html>
